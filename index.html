<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Aplikasi Pencatat Mens (Offline)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        /* Variabel CSS Baru untuk Skema Warna yang Lebih Baik */
        :root {
            --bg: #f7f7f7;
            --primary: #d6336c;
            /* Merah Muda Khas Menstruasi */
            --primary-soft: #ffe6ef;
            --secondary: #4a5568;
            /* Abu-abu Gelap untuk Teks Utama */
            --muted: #a0aec0;
            /* Abu-abu Terang untuk Teks Sekunder */
            --border-color: #e2e8f0;
            --shadow-light: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-medium: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --ovulation: #f6ad55;
            /* Kuning/Oranye untuk Ovulasi */
            --ovulation-soft: #fff3d7;
            --today: #4299e1;
            /* Biru untuk Hari Ini */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 16px;
            background: var(--bg);
            color: var(--secondary);
            line-height: 1.5;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 20px;
            color: var(--primary);
            text-align: center;
        }

        h3 {
            font-size: 18px;
            color: var(--secondary);
            margin: 16px 0 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
        }

        /* --- Kontrol & Input --- */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            padding: 10px;
            background: #fff;
            border-radius: 12px;
            box-shadow: var(--shadow-light);
        }

        .row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .input-group {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        label.small {
            font-size: 12px;
            color: var(--muted);
            white-space: nowrap;
        }

        input[type=number] {
            width: 50px;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #fff;
            text-align: center;
            font-size: 14px;
        }

        /* --- Kalender --- */
        .calendar-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 6px;
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            background: #fff;
            padding: 12px;
            border-radius: 12px;
            box-shadow: var(--shadow-medium);
        }

        .day {
            padding: 10px 0;
            min-height: 56px;
            border-radius: 8px;
            border: none;
            background: var(--bg);
            text-align: center;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 0 1px var(--border-color) inset;
        }

        .day:hover:not(.muted) {
            background: #f0f0f0;
        }

        .day-num {
            font-weight: 600;
            z-index: 10;
        }

        .day.muted {
            opacity: 0.6;
            color: var(--muted);
            background: #fff;
            box-shadow: none;
        }

        /* Marker Visual */
        .marker {
            position: absolute;
            inset: 0;
            border-radius: 8px;
            opacity: 0.7;
            z-index: 5;
        }

        .period .marker {
            background: var(--primary-soft);
            border: 1px solid var(--primary);
            opacity: 1;
        }

        .pred-period .marker {
            background: #fddde4;
            border: 1px dashed var(--primary);
            opacity: 0.8;
        }

        .fertile {
            box-shadow: 0 0 0 3px var(--ovulation);
            /* Garis luar tebal */
        }

        .today {
            box-shadow: 0 0 0 3px var(--today);
            /* Garis luar biru untuk hari ini */
            background: #ebf8ff;
        }

        /* Posisikan Ovulasi di atas Prediksi Mens jika tumpang tindih */
        .fertile.pred-period {
            box-shadow: 0 0 0 3px var(--ovulation);
        }

        /* --- Tombol Umum --- */
        button {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #fff;
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 14px;
            font-weight: 500;
        }

        button:hover {
            background: #f0f0f0;
        }

        .main-btn {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .main-btn:hover {
            background: #c02d5c;
        }

        /* Tombol Navigasi Bulan */
        #prevBtn,
        #nextBtn {
            width: 40px;
            height: 40px;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
        }

        #monthLabel {
            min-width: 130px;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
        }

        /* --- Popup --- */
        .popup {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--shadow-medium);
            min-width: 280px;
            max-width: 90%;
            z-index: 20;
            text-align: center;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .5);
            z-index: 15;
        }

        #popupDate {
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .popup .row {
            justify-content: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .popup button {
            flex-grow: 1;
            min-width: 100px;
        }

        /* --- History & Prediksi --- */
        .history,
        .pred {
            margin-top: 20px;
            padding: 15px;
            background: #fff;
            border-radius: 12px;
            box-shadow: var(--shadow-light);
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 8px;
            background: #fafafa;
        }

        .item div div {
            font-size: 14px;
        }

        .item button {
            font-size: 12px;
            padding: 6px 10px;
        }

        .foot {
            margin-top: 12px;
            font-size: 14px;
            color: var(--muted);
            text-align: center;
        }

        .foot.pred-info {
            text-align: left;
            margin-top: 0;
            padding: 5px 0;
        }

        .pred-info div {
            margin-bottom: 5px;
            display: flex;
            align-items: center;
        }

        .pred-info b {
            font-weight: 700;
            color: var(--secondary);
        }

        .icon {
            margin-right: 8px;
            width: 18px;
            text-align: center;
        }

        /* --- Responsivitas Mobile --- */
        @media(max-width: 450px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 22px;
                margin-bottom: 15px;
            }

            .controls {
                flex-direction: column;
                gap: 10px;
                padding: 10px;
            }

            .row {
                width: 100%;
                justify-content: space-between;
            }

            .input-group {
                width: 100%;
                justify-content: space-around;
            }

            .calendar {
                gap: 4px;
                padding: 8px;
            }

            .day {
                padding: 6px 0;
                min-height: 40px;
                font-size: 13px;
                border-radius: 6px;
            }

            .day-num {
                font-size: 14px;
            }

            .popup button {
                padding: 8px 10px;
                min-width: unset;
                font-size: 13px;
            }

            .foot {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1><i class="fas fa-calendar-alt"></i> Aplikasi Pencatat Mens (Offline)</h1>

        <div class="controls">
            <div class="row">
                <button id="prevBtn"><i class="fas fa-chevron-left"></i></button>
                <div id="monthLabel" style="min-width:150px;text-align:center"></div>
                <button id="nextBtn"><i class="fas fa-chevron-right"></i></button>
            </div>

            <div class="input-group">
                <label class="small">Siklus (Hari)</label>
                <input id="cycleLen" type="number" min="20" value="28" />
                <label class="small">Durasi (Hari)</label>
                <input id="periodLen" type="number" min="1" value="5" />
            </div>
        </div>

        <div class="calendar-header">
            <div>Min</div>
            <div>Sen</div>
            <div>Sel</div>
            <div>Rab</div>
            <div>Kam</div>
            <div>Jum</div>
            <div>Sab</div>
        </div>

        <div class="calendar" id="calendar"></div>

        <div class="pred" id="predWrap">
            <h3><i class="fas fa-chart-line"></i> Prediksi Siklus</h3>
            <div id="predContent" class="foot pred-info"></div>
        </div>

        <div class="history" id="historyWrap">
            <h3><i class="fas fa-history"></i> Riwayat Menstruasi</h3>
            <div id="historyList"></div>
        </div>
    </div>

    <div id="overlay" class="overlay" style="display:none"></div>
    <div id="popup" class="popup" style="display:none">
        <div id="popupDate"></div>
        <div class="row">
            <button id="markStart" class="main-btn"><i class="fas fa-tint"></i> Awal Mens</button>
            <button id="markEnd">Akhir Mens</button>
            <button id="clearMark">Hapus</button>
        </div>
        <div style="text-align:right;">
            <button id="closePop"
                style="border:none; background:none; color: var(--muted); padding: 5px;">Tutup</button>
        </div>
    </div>

    <script>
        // Fungsi utilitas
        function fmt(d) { return d.toISOString().slice(0, 10); } // YYYY-MM-DD (untuk data internal)
        function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
        function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
        function endOfMonth(d) { return new Date(d.getFullYear(), d.getMonth() + 1, 0); }
        function isSameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }

        // --- FUNGSI BARU UNTUK FORMAT TAMPILAN YYYY-BLN-DD (singkatan) ---
        function formatDateForDisplayShort(d) {
            const year = d.getFullYear();
            // Mengambil nama bulan 3 huruf dalam bahasa Inggris (EN) lalu diubah menjadi huruf kapital
            const month = d.toLocaleDateString('en', { month: 'short' }).toLowerCase().replace(/^\w/, c => c.toUpperCase());
            // Mengambil tanggal dengan padding (01, 02, dst)
            const day = d.getDate().toString().padStart(2, '0');
            // Menyatukan format: YYYY-BLN-DD
            return `${year}-${month}-${day}`;
        }
        // --------------------------------------------------------

        const state = {
            current: new Date(),
            history: [],
            cycleLen: 28,
            periodLen: 5
        };

        // ----------------------------------
        // LOAD dari localStorage
        // ----------------------------------
        try {
            const raw = localStorage.getItem("period_app_v1");
            if (raw) {
                const d = JSON.parse(raw);
                if (d.history) state.history = d.history;
                if (d.cycleLen) state.cycleLen = Number(d.cycleLen);
                if (d.periodLen) state.periodLen = Number(d.periodLen);
            }
        } catch (e) { console.warn(e); }

        // Update nilai input dari state yang diload
        document.getElementById("cycleLen").value = state.cycleLen;
        document.getElementById("periodLen").value = state.periodLen;


        const cal = document.getElementById("calendar");
        const monthLabel = document.getElementById("monthLabel");
        const historyList = document.getElementById("historyList");
        const predContent = document.getElementById("predContent");

        // Popup
        const popup = document.getElementById("popup");
        const overlay = document.getElementById("overlay");
        const popupDate = document.getElementById("popupDate");
        let popupTarget = null;

        // ----------------------------------
        // SIMPAN LOCAL STORAGE
        // ----------------------------------
        function save() {
            localStorage.setItem("period_app_v1", JSON.stringify({
                history: state.history,
                cycleLen: state.cycleLen,
                periodLen: state.periodLen,
            }));
        }

        // ----------------------------------
        // PREDIKSI
        // ----------------------------------
        function getLastStart() {
            if (!state.history.length) return null;
            return new Date(state.history[state.history.length - 1].start + "T00:00:00");
        }

        function averageCycle() {
            if (state.history.length < 2) return state.cycleLen;
            const starts = state.history.map(h => new Date(h.start + "T00:00:00"));
            const diffs = [];
            for (let i = 1; i < starts.length; i++) {
                diffs.push((starts[i] - starts[i - 1]) / (1000 * 60 * 60 * 24));
            }
            const sum = diffs.reduce((s, x) => s + x, 0);
            return Math.round(sum / diffs.length) || state.cycleLen;
        }

        function predict() {
            const last = getLastStart();
            if (!last) return null;
            const avg = averageCycle();

            const nextStart = addDays(last, avg);
            const nextEnd = addDays(nextStart, state.periodLen - 1);

            const ov = addDays(nextStart, -14);
            const fertileStart = addDays(ov, -5);
            const fertileEnd = addDays(ov, 1);

            return { nextStart, nextEnd, ov, fertileStart, fertileEnd, avg };
        }

        // ----------------------------------
        // RENDER CALENDAR
        // ----------------------------------
        function renderCalendar() {
            cal.innerHTML = "";
            const first = startOfMonth(state.current);
            const last = endOfMonth(state.current);

            // Teks label bulan di kalender tetap menggunakan nama penuh bahasa Indonesia
            monthLabel.textContent = first.toLocaleString("id", { month: "long", year: "numeric" });

            const start = new Date(first);
            start.setDate(first.getDate() - first.getDay());

            const end = new Date(last);
            end.setDate(last.getDate() + (6 - last.getDay()));

            const pred = predict();
            const today = new Date();

            for (let d = new Date(start); d <= end; d = addDays(d, 1)) {
                const iso = fmt(d);
                const btn = document.createElement("button");
                btn.className = "day";

                btn.innerHTML = `<div class='day-num'>${d.getDate()}</div><div class='marker'></div>`;

                if (d.getMonth() !== state.current.getMonth()) btn.classList.add("muted");

                if (isSameDay(d, today)) btn.classList.add("today");

                const inPeriod = state.history.some(h => iso >= h.start && iso <= h.end);
                if (inPeriod) btn.classList.add("period");

                if (pred) {
                    const isPredPeriod = iso >= fmt(pred.nextStart) && iso <= fmt(pred.nextEnd);
                    const isFertile = iso >= fmt(pred.fertileStart) && iso <= fmt(pred.fertileEnd);

                    if (isPredPeriod && !inPeriod)
                        btn.classList.add("pred-period");

                    if (isFertile)
                        btn.classList.add("fertile");

                }

                btn.onclick = () => openPopup(d);
                cal.appendChild(btn);
            }
        }

        // ----------------------------------
        // RENDER HISTORY (Diperbarui menggunakan formatDateForDisplayShort)
        // ----------------------------------
        function renderHistory() {
            historyList.innerHTML = "";
            if (!state.history.length) {
                historyList.innerHTML = "<div class='foot muted'>Belum ada riwayat menstruasi yang tercatat.</div>";
                return;
            }

            const sortedHistory = [...state.history].sort((a, b) => b.start.localeCompare(a.start));

            sortedHistory.forEach((h, i) => {
                const item = document.createElement("div");
                item.className = "item";

                const startDate = new Date(h.start + "T00:00:00");
                const endDate = new Date(h.end + "T00:00:00");
                const durationMs = endDate - startDate;
                const durationDays = Math.round(durationMs / (1000 * 60 * 60 * 24)) + 1;

                let cycleLengthInfo = '';
                const originalIndex = state.history.findIndex(orig => orig.start === h.start && orig.end === h.end);

                if (originalIndex > 0) {
                    const prevStart = new Date(state.history[originalIndex - 1].start + "T00:00:00");
                    const cycleMs = startDate - prevStart;
                    const cycleDays = Math.round(cycleMs / (1000 * 60 * 60 * 24));
                    cycleLengthInfo = `Siklus: ${cycleDays} hari`;
                }

                item.innerHTML = `
                    <div>
                        <div><b>Awal:</b> ${formatDateForDisplayShort(startDate)}</div>
                        <div><b>Akhir:</b> ${formatDateForDisplayShort(endDate)} (${durationDays} hari)</div>
                        ${cycleLengthInfo ? `<div>${cycleLengthInfo}</div>` : ''}
                    </div>
                `;

                const rm = document.createElement("button");
                rm.innerHTML = '<i class="fas fa-trash"></i> Hapus';
                rm.onclick = () => {
                    const indexToRemove = state.history.findIndex(item => item.start === h.start && item.end === h.end);
                    if (indexToRemove > -1) {
                        state.history.splice(indexToRemove, 1);
                        save();
                        renderAll();
                    }
                };
                item.appendChild(rm);
                historyList.appendChild(item);
            });
        }

        // ----------------------------------
        // RENDER PREDIKSI (Diperbarui menggunakan formatDateForDisplayShort)
        // ----------------------------------
        function renderPred() {
            const p = predict();
            if (!p) {
                predContent.innerHTML = "<div class='muted'>Catat minimal dua kali periode menstruasi untuk mendapatkan prediksi yang akurat.</div>";
                return;
            }

            const cycleText = state.history.length >= 2 ? `(rata-rata ${p.avg} hari)` : `(default ${state.cycleLen} hari)`;

            predContent.innerHTML = `
                <div style="color: var(--primary);">
                    <div class="icon"><i class="fas fa-calendar-check"></i></div>
                    <div>Periode berikutnya: <b>${formatDateForDisplayShort(p.nextStart)}</b> &ndash; <b>${formatDateForDisplayShort(p.nextEnd)}</b></div>
                </div>
                <div style="color: var(--ovulation);">
                    <div class="icon"><i class="fas fa-egg"></i></div>
                    <div>Ovulasi: <b>${formatDateForDisplayShort(p.ov)}</b></div>
                </div>
                <div style="color: var(--ovulation);">
                    <div class="icon"><i class="fas fa-heart"></i></div>
                    <div>Masa subur: <b>${formatDateForDisplayShort(p.fertileStart)}</b> &ndash; <b>${formatDateForDisplayShort(p.fertileEnd)}</b></div>
                </div>
                <div style="margin-top: 10px; font-size: 12px; color: var(--muted); text-align: left;">
                    <div class="icon"><i class="fas fa-info-circle"></i></div>
                    <div>Perhitungan berdasarkan siklus ${cycleText}.</div>
                </div>
            `;
        }

        // ----------------------------------
        // POPUP ACTIONS
        // ----------------------------------
        function openPopup(d) {
            popupTarget = d;
            // Popup tetap menggunakan format panjang bahasa Indonesia agar lebih jelas
            popupDate.innerHTML = `Tandai: ${d.toLocaleDateString("id", { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}`;
            overlay.style.display = "block";
            popup.style.display = "block";
        }

        function closePopup() {
            overlay.style.display = "none";
            popup.style.display = "none";
            popupTarget = null;
        }

        document.getElementById("markStart").onclick = () => {
            const s = fmt(popupTarget);
            state.history = state.history.filter(h => !(s >= h.start && s <= h.end));

            const e = fmt(addDays(popupTarget, state.periodLen - 1));
            state.history.push({ start: s, end: e });
            state.history.sort((a, b) => a.start.localeCompare(b.start));
            save();
            renderAll();
            closePopup();
        };

        document.getElementById("markEnd").onclick = () => {
            if (state.history.length) {
                const lastPeriod = state.history[state.history.length - 1];
                if (fmt(popupTarget) >= lastPeriod.start) {
                    lastPeriod.end = fmt(popupTarget);
                    save();
                    renderAll();
                } else {
                    alert("Tanggal akhir harus setelah atau sama dengan tanggal awal periode terakhir.");
                }
            }
            closePopup();
        };

        document.getElementById("clearMark").onclick = () => {
            const iso = fmt(popupTarget);
            const initialLength = state.history.length;
            state.history = state.history.filter(h => !(iso >= h.start && iso <= h.end));

            if (state.history.length < initialLength) {
                save();
                renderAll();
            } else {
                alert("Tanggal ini tidak termasuk dalam periode menstruasi yang tercatat.");
            }
            closePopup();
        };

        document.getElementById("closePop").onclick = closePopup;
        overlay.onclick = closePopup;

        // ----------------------------------
        // BUTTON NEXT / PREV
        // ----------------------------------
        document.getElementById("prevBtn").onclick = () => {
            state.current.setMonth(state.current.getMonth() - 1);
            renderAll();
        };
        document.getElementById("nextBtn").onclick = () => {
            state.current.setMonth(state.current.getMonth() + 1);
            renderAll();
        };

        // ----------------------------------
        // INPUT CHANGE
        // ----------------------------------
        document.getElementById("cycleLen").onchange = (e) => {
            const val = Number(e.target.value);
            state.cycleLen = (val >= 20 && val <= 45) ? val : 28;
            e.target.value = state.cycleLen;
            save(); renderAll();
        };
        document.getElementById("periodLen").onchange = (e) => {
            const val = Number(e.target.value);
            state.periodLen = (val >= 1 && val <= 15) ? val : 5;
            e.target.value = state.periodLen;
            save(); renderAll();
        };

        // ----------------------------------
        function renderAll() {
            renderCalendar();
            renderHistory();
            renderPred();
        }

        renderAll();
    </script>

</body>

</html>
